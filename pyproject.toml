[project]
name = "meeting-cue"
version = "0.0.1"
description = "会議中の質問を即座に判定し、Obsidian の知識と逆質問の候補を出すリアルタイム補助"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meetcue = "meetcue.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetcue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
