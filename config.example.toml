# Meeting Cue! の設定雛形。実体は ~/.meeting-cue/config.toml に置く(git 外)。
# 鍵は ~/.secrets/meeting-cue.env に OPENROUTER_API_KEY=... の 1 行(このファイルには書かない)。

vault_root = "~/ObsidianVault/vault"     # Obsidian Vault のルート(索引対象)。⚙ の「Obsidian」で選んだものが優先
mode = "participant"                    # participant | presenter | audience
privacy = "private"                     # private(クラウド可)| local(クラウド呼び出しなし)
locale = "ja-JP"
# 自分の立場の要約(キュー生成のプロンプトに入る。氏名・連絡先など PII は書かない)
profile = "例: IT 企業のエンジニア。担当分野(製品・技術)と、会議でよく聞かれる話題を短く。"
# Windows だけ: 取り込む機器(名前の一部・空 = 既定の機器)。一覧は
#   ~/.meeting-cue/stt-venv/Scripts/python.exe helpers/windows/stt_helper/stt_helper.py --list-devices
# loopback_device = "Headset"           # 相手の声を聞く出力機器(再生中の音をまとめて取る)
# mic_device = "USB"                    # 自分の声のマイク
# stt_python = "~/.meeting-cue/stt-venv/Scripts/python.exe"   # STT ヘルパー専用の仮想環境(packaging/windows/setup.ps1 が作る)

[llm]
model = "anthropic/claude-haiku-5.5"     # 既定(OpenRouter の model id)。回答・質問タブ・用語(2026-10-08 から Haiku 5.5)
fast_model = "anthropic/claude-haiku-5.5" # サマリ
provider_order = ["Anthropic"]           # 2026-09-25 実測: AWS 経由だと初トークン 3.3s、Anthropic 直で 1.2s
max_tokens = 1200
monthly_budget_usd = 10.0                # 超えたらナレッジカードのみで続行(fail-closed)
# 開発者向け(既定オフ・自己責任): この Mac でログイン済みの Claude Code(claude -p)を、自分の Claude の月額プランで呼ぶ。
# true にすると設定画面の接続先に「Claude サブスク(Claude Code 経由・開発者向け)」が出る。アプリは認証情報に触れない。
# Anthropic は他社アプリが Claude.ai のログインを提供すること・利用者の代わりにプランで通信することを禁止しているので、
# 自分の用途だけに使い、ほかの人に使わせる形で配らない(docs/REQUIREMENTS.md FR-10b)。
# subscription_cli = false
# claude_cli_path = ""                   # 空 = PATH と ~/.local/bin/claude から探す
# claude_cli_warm = 2                    # 録音中に先に起動して待たせておく数(1 つ約 240 MB)

[jev]
model = "typesafe/jev-1.13"
act_min = 0.6                            # speech_act が question/request である確率の下限
to_me_min = 0.5                          # 自分宛である確率の下限(較正は Phase 2)

[selector]                      # 選ぶ係: 候補を多めに生成し、Jev が基準ごとに採点 → 重み付き合計の上位に ★
enabled = true
n_answers = 5                   # 生成する回答候補の本数(表示は display 件)
n_counters = 5
display = 3
# 重み(どの基準を重く見るかは人が決める)。省略時は meetcue/judge/selector.py の既定 + mode / intent の上書き
# [selector.weights.answer]
# on_point = 1.0        # 質問に正面から答えているか
# grounded = 1.0        # 根拠の具体性
# speakable = 0.7       # その場で口に出せるか
# safe = 0.7            # 断定しすぎ・誤りの恐れの低さ
# persuasive = 0.8      # 説得力
# [selector.weights.counter]
# reveals_intent = 1.0  # 相手の意図・前提を引き出すか
# answerable = 0.7      # 相手がすぐ答えられるか
# advances = 0.8        # 次の一手に進めるか
# polite = 0.5          # 場に合うか

[index]
include = ["01_Projects", "02_Ideas", "03_Resources", "04_Context"]
# 仕事のメモや自動のログなど、回答候補に混ぜたくないフォルダは exclude に足す
exclude = ["04_Context/Session_Log", "04_Context/Discord_Log", "04_Context/Compact_Snapshots",
           "04_Context/Memo_Private", "00_Inbox/_processed", "_Archive",
           "03_Resources/YouTube"]   # 動画ノート(コメント単位の雑音・索引 1.2 GB)。含めるなら消す
chunk_chars = 800
top_k = 5

[planner]                      # 質問タブ(こちらから聞くべき質問の先回り)。相手からの質問への回答が常に優先
auto = true                    # 話が進んだら自動で(Haiku 5.5)。画面の「自動で考える」で切り替えられる
interval_s = 60                # 自動は最大 1 分に 1 回
min_new_chars = 120            # 前回から会話がこれだけ進んだら
cooldown_s = 10                # 回答の生成が終わってからこの秒数は自動で考えない
mid_model = "anthropic/claude-sonnet-5.5"  # 「少し深く」(回答タブの深掘りも同じ)
mid_reasoning = "low"                      # 思考の量(Sonnet 5.5 は思考を切れない)
deep_model = "anthropic/claude-opus-5.5"   # 「深く考える」
n = 5                          # 候補の本数(Jev の採点で上位 3 件に ★)

[dig]                          # 深掘り(回答タブの「少し深く = Sonnet 5.5」「深く = Opus 5.5」)
top_k_mid = 8                  # Vault から引く件数(回答の 5 件より多く)
top_k_deep = 12
body_chars = 1200              # 1 件あたりの本文
mid_reasoning = "low"          # 思考の量(low / medium / high)
deep_reasoning = "medium"
mcp_timeout_s = 4.5            # Obsidian の MCP 検索を待つ上限(過ぎたら索引だけで続ける)。簡易検索は 1 語 2.4〜3.5 s
mcp_terms = 1                  # MCP で引く語の数(1 語ずつ順に引くので、増やすとその分待つ)

[glossary]                     # 用語タブ(会話に出た専門用語に説明と自分のノートを付ける・Haiku 5.5)
auto = true                    # 画面の「自動で拾う」で切り替えられる
interval_s = 8                 # 自動は最短この間隔
min_chars = 40                 # 前回から会話がこれだけ進んだら
max_terms = 4                  # 1 回に拾う語の上限
# level = "高校以上〜大学で習う語・業界の専門用語・技術用語・略語"   # 拾う語の水準

[redo]                         # 録音後の文字起こしし直し(止めたら録音から丸ごと認識し直して差し替える・今は Windows だけ)
enabled = true                 # false で止める(会議中の文字起こしのまま)。手で頼むときは `meetcue redo <記録>`
gap_s = 1.5                    # 語と語の間がこれ以上なら行を分ける(秒)

[segmenter]
pause_ms = 500                 # partial 更新が止まってから finalize を送るまで(通常)
pause_incomplete_ms = 900      # 末尾が助詞・語中のとき(まだ続く)
pause_sentence_ms = 300        # 末尾が文末記号のとき(速く切る)
safety_ms = 2500               # finalize 後に final が来なければ強制確定
flush_carry_ms = 1500          # 繰り越した切れ端を単独で出すまで
max_chars = 120
long_utterance_ms = 8000       # 間が来ないまま話し続けても、これを超えて文末があれば確定(0 で無効)
long_utterance_hard_ms = 20000 # これを超えたら文末がなくても確定(0 で無効)

[segmenter_tap]                 # file / tap 音源(会議アプリの出力)。partial が約 1 秒周期で届くため 1 秒超で待つ
pause_ms = 1200
pause_incomplete_ms = 1600
pause_sentence_ms = 1100
safety_ms = 3000
long_utterance_ms = 8000       # 2026-09-26 実測: 一人語りで確定が最大 59 s 遅れた対策
long_utterance_hard_ms = 20000

[segmenter_self]                # 自分の声(マイク・channel=mic)。短く切ると文の途中で切れて誤りが増える(2026-09-27 読み上げ 6 回ずつ:
pause_ms = 1200                 # 500/900/300 ms で CER 平均 28.6% → この値で 26.4%)。自分の発言は判定に使わないので確定が遅れても困らない。
pause_incomplete_ms = 1600      # 対面の相手(room)は判定を急ぐので [segmenter] のまま
pause_sentence_ms = 1100
safety_ms = 3000

[soniox]                        # 会議の文字起こしを Soniox で(FR-2b・「録音を開始」で会議ごとに選ぶ・鍵は ⚙)
region = "us"                   # jp は Soniox の Console で申請(鍵も別)
language_hints = ["ja", "en"]
# terms_file = "~/.meeting-cue/soniox_terms.txt"   # 会議で渡す語(1 行 1 語)

[dictation]                     # 音声入力(FR-14 / FR-14b)。キー・方式・送信コマンドなど画面で変える項目は ~/.meeting-cue/dictation/settings.json
hold_ms = 400                   # これ以上押してから離したら、押している間だけ録る
toggle_taps = 2                 # 2 = 短く 2 回押すとハンズフリー(1 回だけは取り消し)/ 1 = 短く 1 回押すとハンズフリー
double_ms = 450                 # 2 回押しの間隔の上限(1 回目を離してから)
max_s = 300.0                   # 録りっぱなしを止める長さ
region = "us"
realtime_gap_ms = 500           # リアルタイムのとき、この長さの間で区切って貼る
fin_timeout_s = 5.0             # finalize から確定を待つ上限
keep_audio = true               # 1 回ごとの録音を ~/.meeting-cue/dictation/<日付>/ に残す(プライバシーモードでは残さない)
